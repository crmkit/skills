name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatched by tag-release.yaml at the new tag ref. Needed because tags
  # pushed with GITHUB_TOKEN do not trigger the push-tags event above.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Package skills
        run: |
          VERSION="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          mkdir -p dist

          # Flat bundle: the skill folders (each a folder with a SKILL.md) sit at
          # the zip ROOT, so it extracts straight into an agent's skills directory
          # (unzip -d ~/.claude/skills/). CI internals (.github), VERSION and git
          # metadata are excluded.
          zip -r "dist/crmkit-skills-${VERSION}.zip" crmkit-*/ -x '*/.*'

          # A stable, version-independent copy so docs can link a fixed URL:
          # releases/latest/download/crmkit-skills.zip (same bytes, no version).
          cp "dist/crmkit-skills-${VERSION}.zip" "dist/crmkit-skills.zip"

          (cd dist && sha256sum crmkit-skills*.zip > checksums.txt)
          echo "Packaged:"; ls -1 dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
