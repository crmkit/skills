name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatched by tag-release.yaml at the new tag ref. Needed because tags
  # pushed with GITHUB_TOKEN do not trigger the push-tags event above.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skills
        run: |
          VERSION="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          BUNDLE="crmkit-skills-${VERSION}"
          mkdir -p "dist/${BUNDLE}"

          # Copy the skill directories (each is a folder with a SKILL.md) plus
          # the top-level docs, into a versioned bundle directory. CI internals
          # (.github), VERSION, and git metadata are intentionally excluded.
          for d in crmkit-*/; do
            cp -r "$d" "dist/${BUNDLE}/"
          done
          cp README.md LICENSE "dist/${BUNDLE}/" 2>/dev/null || true

          # Zip with the version in the archive name, and a checksum.
          (cd dist && zip -r "${BUNDLE}.zip" "${BUNDLE}")
          (cd dist && sha256sum "${BUNDLE}.zip" > checksums.txt)

          echo "Packaged dist/${BUNDLE}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
