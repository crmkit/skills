name: CI

on:
  push:
    branches:
      - main
      - next
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - '*.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          # shellcheck is preinstalled on GitHub's ubuntu runners.
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts to check."
            exit 0
          fi
          echo "Checking ${#scripts[@]} script(s):"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"
